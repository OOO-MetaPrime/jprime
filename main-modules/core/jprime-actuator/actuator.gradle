import java.time.LocalDateTime
import java.time.ZoneId
import org.gradle.api.provider.ValueSource
import org.gradle.api.provider.ValueSourceParameters
import javax.inject.Inject

ext {
  SUBMODULES_SECTION_NAME = 'submodules'
  PROJECT_VERSION_TITLE = 'Project-Version'
  BUILD_DATE_TITLE = 'Build-Date'
}

static String getDate(String format) {
  LocalDateTime.now(ZoneId.of("Europe/Moscow")).format(format).toString()
}

abstract class GitSubmodulesHashSource implements ValueSource<String, ValueSourceParameters.None> {
  @Inject
  abstract ExecOperations getExecOperations()

  @Override
  String obtain() {
    def output = new ByteArrayOutputStream()
    execOperations.exec {spec ->
      spec.commandLine('git', 'submodule', 'foreach', 'git', 'rev-parse', '--short', 'HEAD')
      spec.standardOutput = output
    }
    return output.toString().trim()
  }
}

abstract class GitRootHashSource implements ValueSource<String, ValueSourceParameters.None> {
  @Inject
  abstract ExecOperations getExecOperations()

  @Override
  String obtain() {
    def output = new ByteArrayOutputStream()
    execOperations.exec {spec ->
      spec.commandLine('git', 'rev-parse', '--short', 'HEAD')
      spec.standardOutput = output
    }
    return output.toString().trim()
  }
}

def submodulesHashProvider = providers.of(GitSubmodulesHashSource) {}
def rootHashProvider = providers.of(GitRootHashSource) {}

static String getSubmoduleName(String line) {
  String submodule = null
  if (line.contains(/'/)) {
    submodule = line[line.indexOf(/'/) + 1..line.lastIndexOf(/'/) - 1]
    if (submodule.contains('/')) {
      submodule = submodule[submodule.lastIndexOf('/') + 1..submodule.length() - 1]
    }
    submodule = submodule.replace('.', '_')
  }
  if (!submodule) {
    throw new RuntimeException("Submodule status parsing error: unexpected result from command line")
  }
  submodule
}

ext.getManifestAttrs = {
  return [
      (PROJECT_VERSION_TITLE): rootHashProvider.get(),
      (BUILD_DATE_TITLE)     : getDate('yyyy.MM.dd HH:mm:ss')
  ]
}

ext.getSubmodulesVersion = {
  Map<String, String> attrs = [:]
  String subs = submodulesHashProvider.get()
  String[] lines = subs.split("\n")
  String submodule = null
  for (String line : lines) {
    if (line.startsWith("Entering")) {
      submodule = getSubmoduleName(line)
    } else if (submodule) {
      attrs += [(submodule): line]
      submodule = null
    } else {
      throw new RuntimeException("Submodule status parsing error: unexpected result from command line")
    }
  }
  return attrs
}