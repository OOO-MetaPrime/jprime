[versions]
awaitilityVersion = "4.3.0"
mockwebserverVersion = "4.12.0"
reactorTestVersion = "3.8.6"
testContainersVersion = "2.0.5"

[libraries]
# для тестовых сценариев, когда необходимо оценить не только окончание асинхронной операции, но еще что она завершится в отведенное время
# Документация: https://github.com/awaitility/awaitility/wiki/Usage
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitilityVersion" }

# для тестовых сценариев, когда необходимо выполнить HTTP запрос вернуть заранее подготовленный ответ и получить запрос который сформировала система
# Документация: https://github.com/square/okhttp/blob/master/mockwebserver/README.md
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserverVersion" }

projectreactor-reactor-test = { module = "io.projectreactor:reactor-test", version.ref = "reactorTestVersion" }

testcontainers-mssqlserver = { module="org.testcontainers:testcontainers-mssqlserver", version.ref="testContainersVersion"}
testcontainers-kafka = { module="org.testcontainers:testcontainers-kafka", version.ref="testContainersVersion"}
testcontainers-postgresql = { module="org.testcontainers:testcontainers-postgresql", version.ref="testContainersVersion" }
testcontainers-spock = { module="org.testcontainers:testcontainers-spock", version.ref="testContainersVersion" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testContainersVersion" }

[bundles]
testcontainers-v1 = ['testcontainers-postgresql', 'testcontainers-mssqlserver', 'testcontainers-junit-jupiter', 'projectreactor-reactor-test']
