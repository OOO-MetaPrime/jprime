[versions]
disruptorVersion = "4.0.0"
kafkaLog4JAppenderVersion = "3.9.2"
log4JCoreVersion = "2.26.0"
jclOverSlf4jVersion = "2.0.18"

[libraries]
disruptor = { module="com.lmax:disruptor", version.ref="disruptorVersion" }
kafka-log4j-appender = { module="org.apache.kafka:kafka-log4j-appender", version.ref="kafkaLog4JAppenderVersion" }
log4j-core = { module="org.apache.logging.log4j:log4j-core", version.ref="log4JCoreVersion" }
log4j-slf4j2-impl = { module="org.apache.logging.log4j:log4j-slf4j2-impl", version.ref="log4JCoreVersion" }
jcl-over-slf4j = { module="org.slf4j:jcl-over-slf4j", version.ref="jclOverSlf4jVersion" }

[bundles]
v1 = ['disruptor', 'kafka-log4j-appender']
log4j = ['log4j-core', 'log4j-slf4j2-impl', 'jcl-over-slf4j']