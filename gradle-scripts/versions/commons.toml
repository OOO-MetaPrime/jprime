# Commons
[versions]
caffeineVersion = "3.2.4"

commonsCodecVersion = "1.22.0"
commonsCollections4Version = "4.5.0"
commonsCompressVersion = "1.28.0"
commonsIoVersion = "2.22.0"
commonsLang3Version = "3.20.0"
commonsValidatorVersion = "1.10.1"
commonsNetVersion = "3.13.0"

tikaCoreVersion = "3.3.0"
apacheHttpClientVersion = "5.6.1"
fastjsonVersion = "2.0.62"
jaxbApiVersion = "4.0.4"
jaxbRuntimeVersion = "4.0.5"
jakartaWsApiVersion = "4.0.3"
jaxwsVersion = "4.0.3"
jakartaActivationVersion = "2.1.4"
zxingVersion = "3.5.4" # Генерация штрих кодов и QR кодов
xsomVersion = "4.0.8"
micrometerVersion = "1.15.11"

[libraries]
caffeine = { module="com.github.ben-manes.caffeine:caffeine", version.ref="caffeineVersion" }
codec = { module="commons-codec:commons-codec", version.ref="commonsCodecVersion" }
collections4 = { module="org.apache.commons:commons-collections4", version.ref="commonsCollections4Version" }
compress = { module="org.apache.commons:commons-compress", version.ref="commonsCompressVersion" }
io = { module="commons-io:commons-io", version.ref="commonsIoVersion" }
lang3 = { module="org.apache.commons:commons-lang3", version.ref="commonsLang3Version" }
validator = { module="commons-validator:commons-validator", version.ref="commonsValidatorVersion" }
net = { module="commons-net:commons-net", version.ref="commonsNetVersion" }

tika-core = { module="org.apache.tika:tika-core", version.ref="tikaCoreVersion" }
apache-httpclient = { module="org.apache.httpcomponents.client5:httpclient5", version.ref="apacheHttpClientVersion" }
fastjson = { module="com.alibaba.fastjson2:fastjson2", version.ref="fastjsonVersion" }
jaxb-api = { module="jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jaxbApiVersion" }
jaxb-runtime = { module="org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxbRuntimeVersion" }
jakarta-ws-api = { module="jakarta.xml.ws:jakarta.xml.ws-api", version.ref = "jakartaWsApiVersion" }
jaxws-rt = { module="com.sun.xml.ws:rt", version.ref = "jaxwsVersion" }
jakarta-activation = { module="jakarta.activation:jakarta.activation-api", version.ref = "jakartaActivationVersion" }
zxing-core = { module="com.google.zxing:core", version.ref = "zxingVersion" }
zxing-javase = { module="com.google.zxing:javase", version.ref = "zxingVersion" }
xsom = {module="org.glassfish.jaxb:xsom", version.ref = "xsomVersion"}
micrometer = {module="io.micrometer:micrometer-core", version.ref = "micrometerVersion"}
micrometer-prometheus = {module="io.micrometer:micrometer-registry-prometheus", version.ref = "micrometerVersion"}

[bundles]
jaxb = ['jaxb-api', 'jaxb-runtime']
jaxws = ['jakarta-ws-api', 'jaxws-rt', 'jakarta-activation']
zxing = ['zxing-core', 'zxing-javase']
